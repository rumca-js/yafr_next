{% if not has_query %}
<!-- Large Centered Search Box (When user has not searched yet) -->
<div class="row justify-content-center align-items-center min-vh-75 py-5">
  <div class="col-12 col-md-10 col-lg-8 text-center">
    <div class="mb-4">
      <i class="bi bi-compass display-1 text-primary"></i>
      <h1 class="display-5 fw-bold mt-2">{{ app_name }}</h1>
      <p class="text-secondary fs-5">{{ app_tagline }}</p>
    </div>

    <form method="GET" action="{{ url_for('entries.search_view') }}" class="mb-3" id="main-search-form">
      <div class="position-relative">
        <div class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden border">
          <span class="input-group-text bg-body border-0 ps-4">
            <i class="bi bi-search text-secondary"></i>
          </span>
          <input 
            type="text" 
            name="q" 
            id="main-search-input"
            class="form-control border-0 py-3 fs-5" 
            placeholder="Search entries (e.g. title=news, tag:python, ==exact)..." 
            value="{{ query }}"
            autocomplete="off"
            autofocus
          >
          <button type="button" class="btn btn-outline-secondary border-0 px-3 search-history-btn" title="Search history" data-target="#main-search-input">
            <i class="bi bi-clock-history"></i>
          </button>
          <button class="btn btn-primary px-4 fw-semibold" type="submit">
            Search
          </button>
        </div>
        <!-- Search History Dropdown -->
        <div class="search-history-dropdown dropdown-menu shadow w-100 mt-1" id="main-search-history-dropdown"></div>
      </div>

      <!-- Order / Filter Combobox -->
      <div class="d-flex justify-content-center align-items-center gap-2 mt-3">
        <label for="filter-select" class="text-secondary small fw-medium">
          <i class="bi bi-sort-down me-1"></i>Order:
        </label>
        <select 
          name="filter" 
          id="filter-select" 
          class="form-select form-select-sm w-auto shadow-sm rounded-pill border-secondary-subtle px-3 py-1 text-secondary-emphasis"
          aria-label="Order and search filter"
        >
          {% for f in filters %}
            <option value="{{ f.id }}" {% if f.id == active_filter %}selected{% endif %}>
              {{ f.name }}
            </option>
          {% endfor %}
        </select>

        <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#quickAddLinkModal" title="Add new link to database">
          <i class="bi bi-plus-lg me-1"></i>Add Link
        </button>
      </div>
    </form>

    <!-- Syntax Hint Accordion / Help -->
    <div class="mt-4 text-start">
      <small class="text-muted d-block text-center">
        Supported operators: <code>=</code> (LIKE search, e.g. <code>title=youtube</code>), <code>==</code> (exact match, e.g. <code>title==news</code>).
      </small>
    </div>
  </div>
</div>

{% else %}

<!-- Compact Top Search Bar (When query is active) -->
<div class="bg-body border-bottom py-3 mb-4 shadow-sm">
  <div class="container-fluid px-4">
    <form method="GET" action="{{ url_for('entries.search_view') }}" class="row g-2 align-items-center">
      <div class="col-12 col-md-6 col-lg-7">
        <div class="position-relative">
          <div class="input-group rounded-pill overflow-hidden border">
            <span class="input-group-text bg-body border-0 ps-3">
              <i class="bi bi-search text-secondary"></i>
            </span>
            <input 
              type="text" 
              name="q" 
              id="compact-search-input"
              class="form-control border-0 py-2" 
              placeholder="Search entries..." 
              value="{{ query }}"
              autocomplete="off"
            >
            {% if query %}
              <a href="{{ url_for('entries.search_view') }}" class="btn btn-outline-secondary border-0" title="Clear query">
                <i class="bi bi-x-lg"></i>
              </a>
            {% endif %}
            <button type="button" class="btn btn-outline-secondary border-0 px-3 search-history-btn" title="Search history" data-target="#compact-search-input">
              <i class="bi bi-clock-history"></i>
            </button>
            <button class="btn btn-primary px-4 fw-semibold" type="submit">
              Search
            </button>
          </div>
          <!-- Search History Dropdown -->
          <div class="search-history-dropdown dropdown-menu shadow w-100 mt-1" id="compact-search-history-dropdown"></div>
        </div>
      </div>

      <!-- Order / Filter Combobox & Actions -->
      <div class="col-12 col-md-6 col-lg-5 d-flex justify-content-md-end align-items-center gap-2 flex-wrap">
        <input type="hidden" name="display" value="{{ display_type }}">
        <div class="d-flex align-items-center gap-1">
          <label for="compact-filter-select" class="text-secondary small d-none d-sm-inline">
            <i class="bi bi-sort-down me-1"></i>Order:
          </label>
          <select 
            name="filter" 
            id="compact-filter-select" 
            class="form-select form-select-sm w-auto shadow-sm rounded-pill border-secondary-subtle px-3 py-1 text-secondary-emphasis"
            onchange="this.form.submit()"
            aria-label="Order and search filter"
          >
            {% for f in filters %}
              <option value="{{ f.id }}" {% if f.id == active_filter %}selected{% endif %}>
                {{ f.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <button type="button" class="btn btn-outline-primary btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#quickAddLinkModal" title="Add new entry to database">
          <i class="bi bi-plus-lg me-1"></i>Add Entry
        </button>

        <button type="button" class="btn btn-outline-success btn-sm rounded-pill" title="Mark all entries as read">
          <i class="bi bi-check2-all me-1"></i>Mark All Read
        </button>

      </div>
    </form>
  </div>
</div>
{% endif %}
