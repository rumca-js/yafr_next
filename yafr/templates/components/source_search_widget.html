<!-- Compact Top Search Bar -->
<div class="bg-body border-bottom py-3 mb-3 shadow-sm">
  <div class="container-fluid px-4">
    <form method="GET" action="{{ url_for('sources.sources_list') }}" class="row g-2 align-items-center">
      <div class="col-12 col-md-5 col-lg-6">
        <div class="input-group rounded-pill overflow-hidden border">
          <span class="input-group-text bg-body border-0 ps-3">
            <i class="bi bi-search text-secondary"></i>
          </span>
          <input 
            type="text" 
            name="q" 
            id="top-source-search-input"
            class="form-control border-0 py-2" 
            placeholder="Search sources (e.g. title=news, url=youtube)..." 
            value="{{ query }}"
            autocomplete="off"
            autofocus
          >
          {% if query or show_all %}
            <a href="{{ url_for('sources.sources_list') }}" class="btn btn-outline-secondary border-0" title="Clear query">
              <i class="bi bi-x-lg"></i>
            </a>
          {% endif %}
          <button class="btn btn-primary px-3 fw-semibold" type="submit">
            Search
          </button>
        </div>
      </div>

      <!-- Order Select & Action Buttons -->
      <div class="col-12 col-md-7 col-lg-6 d-flex justify-content-md-end align-items-center gap-2 flex-wrap">
        <!-- Order Select -->
        <div class="d-flex align-items-center gap-1">
          <label for="order-select-top" class="text-secondary small mb-0">Order:</label>
          <select
            name="order"
            id="order-select-top"
            class="form-select form-select-sm w-auto rounded-pill"
            onchange="this.form.submit()"
          >
            {% for f in filters %}
              <option value="{{ f.id }}" {% if f.id == active_filter %}selected{% endif %}>{{ f.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Add Source Dropdown -->
        <div class="dropdown">
          <button class="btn btn-outline-primary btn-sm rounded-pill dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-plus-lg me-1"></i>Add Source
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li><h6 class="dropdown-header">Select Source Type</h6></li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="{{ url_for('sources.source_add_rss') }}">
                <i class="bi bi-rss text-warning"></i>RSS / Atom Feed
              </a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="{{ url_for('sources.source_add_email') }}">
                <i class="bi bi-envelope text-info"></i>Email Newsletter (IMAP)
              </a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="{{ url_for('sources.source_add_parse') }}">
                <i class="bi bi-code-slash text-success"></i>Parse Source (XPath)
              </a>
            </li>
          </ul>
        </div>

        <!-- Fetch Outdated Button -->
        {% if outdated_count > 0 or error_count > 0 %}
          <button type="button" class="btn btn-outline-danger btn-sm rounded-pill btn-fetch-outdated-modal" data-bs-toggle="modal" data-bs-target="#fetchOutdatedModal" title="Fetch outdated sources">
            <i class="bi bi-arrow-clockwise me-1" id="top-fetch-spinner"></i>
            Fetch Outdated ({{ outdated_count }})
            {% if error_count > 0 %}
              <span class="badge bg-warning text-dark rounded-pill ms-1">{{ error_count }} err</span>
            {% endif %}
          </button>
        {% endif %}

        <!-- Pull to Refresh / Reload Button -->
        <a href="{{ request.full_path }}" class="btn btn-outline-secondary btn-sm rounded-pill" id="btn-pull-refresh" title="Reload sources from database">
          <i class="bi bi-arrow-repeat me-1"></i>Reload
        </a>
      </div>
    </form>
  </div>
</div>
