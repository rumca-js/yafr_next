<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }} - Search{% endblock %}</title>

  <!-- Bootstrap 5 CSS via CDN with graceful fallback -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Bootstrap Icons via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Local Base Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Shared Navbar -->
  {% include "components/navbar.html" %}

  <!-- Main Content Block -->
  <main class="flex-grow-1" id="top">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="py-3 text-center text-muted border-top mt-auto small">
    <div class="container">
      <span>{{ app_name }} - Offline-First Link Archive & Feed Reader</span>
      <span class="mx-2">&middot;</span>
      <span>SQLite WAL Engine</span>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Local Application JS -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
